[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-subscription-hub"
version = "0.1.0"
description = "Real-time pub/sub resource update notification engine for MCP clients"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-subscription-hub = "mcp_subscription_hub.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_subscription_hub*"]
